name: Upload to HAR

on:
  push:
    branches: [main]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install harness CLI
        run: curl -fsSL https://raw.githubusercontent.com/harness/harness-cli/v2/install | sh

      - name: Build dummy RPM
        run: |
          sudo apt-get install -y rpm
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > /tmp/rpmbuild/SPECS/hello.spec << 'EOF'
          Name:           hello-test
          Version:        1.0.0
          Release:        1
          Summary:        A test RPM package
          License:        MIT
          %description
          A dummy RPM for testing upload-to-har
          %files
          %changelog
          * Mon Jan 01 2024 Test User <test@example.com> - 1.0.0-1
          - Initial package
          EOF
          rpmbuild --define "_topdir /tmp/rpmbuild" -bb /tmp/rpmbuild/SPECS/hello.spec
          find /tmp/rpmbuild/RPMS -name "*.rpm"

      - name: Upload to HAR
        uses: sameeksha-harness/upload-to-har@main
        with:
          api-url: https://prod1.harness.io
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}
          registry: rpmtest
          type: rpm
          file: /tmp/rpmbuild/RPMS/x86_64/hello-test-1.0.0-1.x86_64.rpm
          name: hello-test
          version: 1.0.0
