name: 'Upload to Harness Artifact Registry'
description: 'Upload a local file to Harness Artifact Registry using the harness CLI (hc)'
author: 'Harness'

inputs:
  api-url:
    description: 'Harness API base URL (e.g. http://localhost:3000, https://qa.harness.io, https://app.harness.io)'
    required: true
  account:
    description: 'Harness account ID'
    required: true
  token:
    description: 'Harness PAT token'
    required: true
  registry:
    description: 'HAR registry name'
    required: true
  type:
    description: 'Artifact type: generic, maven, rpm, npm, conda, composer, go, cargo, dart, python, nuget, swift, puppet, debian, conan, terraform'
    required: true
  file:
    description: 'Local path to the file or directory to upload. For conan, this is the recipe directory.'
    required: true
  name:
    description: 'Artifact name. Required for generic and swift. Used to build the registry-path output for other types.'
    required: false
    default: ''
  version:
    description: 'Artifact version. Required for generic, go, swift, and terraform modules. Embedded in the package file for other types.'
    required: false
    default: ''
  pom-file:
    description: 'Path to the POM file. Required for maven.'
    required: false
    default: ''
  distribution:
    description: 'Debian distribution (e.g. focal, bullseye). Required for debian.'
    required: false
    default: ''
  component:
    description: 'Debian component (e.g. main, contrib, non-free). Required for debian.'
    required: false
    default: ''
  namespace:
    description: 'Terraform namespace. Required for terraform.'
    required: false
    default: ''
  scope:
    description: 'Swift scope. Required for swift. Combined with name and version as <scope>/<name>/<version>.'
    required: false
    default: ''
  reference:
    description: 'Conan reference (e.g. pkg/1.0.0@user/channel). Required for conan.'
    required: false
    default: ''
  extra-args:
    description: 'Newline-separated extra CLI arguments appended to the push command'
    required: false
    default: ''

outputs:
  registry-path:
    description: 'The registry/name@version path of the uploaded artifact'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'upload-cloud'
  color: 'green'
